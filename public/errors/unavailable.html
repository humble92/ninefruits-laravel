<!DOCTYPE html>
<!--
    Shown by the web server (Nginx) when the application does not answer: 502, 503, 504.
    Plain HTML, no build and no PHP. The texts are errors.unavailable.* and errors.reference
    from lang/; tests/Feature/Security/ErrorPagesTest.php fails when they drift apart.
    The reference is Nginx's $request_id through SSI (see the installation manual).
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Temporarily unavailable</title>
    <style>
        body { margin: 0; background: #fafafa; color: #18181b; font: 1rem/1.6 system-ui, sans-serif; }
        main { max-width: 32rem; margin: clamp(2rem, 12vh, 8rem) auto; padding: 0 1rem; }
        section { padding: 1.5rem; border: 1px solid #e4e4e7; border-radius: .75rem; background: white; }
        .icon { display: inline-flex; width: 2.75rem; height: 2.75rem; margin-bottom: .75rem; align-items: center; justify-content: center; border-radius: 9999px; background: #eef2ff; color: #3730a3; }
        .icon svg { width: 1.5rem; height: 1.5rem; }
        h1 { margin: 0; font-size: 1.5rem; line-height: 1.3; }
        p { margin: .75rem 0 0; color: #52525b; }
        .meta { margin: 1.25rem 0 0; padding-top: .75rem; border-top: 1px solid #f4f4f5; font-size: .8125rem; color: #71717a; }
        .meta code { font: .8125rem ui-monospace, monospace; user-select: all; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <main>
        <section>
            <span class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 9v6m-4.5 0V9M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
                </svg>
            </span>
            <h1 id="title">Temporarily unavailable</h1>
            <p id="message">The service is under maintenance or temporarily unavailable. Please try again shortly.</p>
            <p class="meta" id="meta" hidden><span id="reference">Reference</span> <code id="request-id"><!--# echo var="request_id" default="" --></code></p>
        </section>
    </main>
    <script type="application/json" id="messages">

        },

            "reference": "Mã tham chiếu"
        },
        "zh_CN": {
            "title": "暂时无法使用",
            "message": "系统正在维护或暂时无法使用。请稍后再试。",
            "reference": "参考编号"
        }
    }
    </script>
    <script>
        (() => {
            const messages = JSON.parse(document.getElementById('messages').textContent);
            const wanted = (navigator.languages || [navigator.language]).filter(Boolean);
            const locale = wanted.map((tag) => tag.replace('-', '_'))
                .flatMap((tag) => [tag, tag.split('_')[0]])
                .find((tag) => tag in messages);

            if (locale) {
                const text = messages[locale];
                document.documentElement.lang = locale.replace('_', '-');
                document.title = text.title;
                document.getElementById('title').textContent = text.title;
                document.getElementById('message').textContent = text.message;
                document.getElementById('reference').textContent = text.reference;
            }

            if (document.getElementById('request-id').textContent.trim() !== '') {
                document.getElementById('meta').hidden = false;
            }
        })();
    </script>
</body>
</html>
